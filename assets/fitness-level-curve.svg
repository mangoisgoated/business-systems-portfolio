<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" role="img" aria-label="Fitness RPG level curve" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<rect width="900" height="360" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#616e7c"/></marker></defs>
<text x="24" y="32" font-size="18" fill="#1f2933" font-weight="700" text-anchor="start">Level curve (levels 1 to 7 from the LEVELS sheet)</text><text x="24" y="52" font-size="12" fill="#616e7c" font-weight="400" text-anchor="start">Each level costs more XP than the last: 1,000 then 1,549, 1,858, 2,091, 2,284, 2,451.</text><line x1="80" x2="840" y1="290" y2="290" stroke="#cbd2d9"/><text x="72" y="294" font-size="11" fill="#616e7c" font-weight="400" text-anchor="end">0</text><line x1="80" x2="840" y1="223.33333333333334" y2="223.33333333333334" stroke="#cbd2d9"/><text x="72" y="227.33333333333334" font-size="11" fill="#616e7c" font-weight="400" text-anchor="end">4,000</text><line x1="80" x2="840" y1="156.66666666666669" y2="156.66666666666669" stroke="#cbd2d9"/><text x="72" y="160.66666666666669" font-size="11" fill="#616e7c" font-weight="400" text-anchor="end">8,000</text><line x1="80" x2="840" y1="90" y2="90" stroke="#cbd2d9"/><text x="72" y="94" font-size="11" fill="#616e7c" font-weight="400" text-anchor="end">12,000</text><path d="M80 290L206.66666666666666 273.3333333333333L333.3333333333333 247.51666666666665L460 216.55L586.6666666666666 181.7L713.3333333333334 143.63333333333333L840 102.78333333333333" fill="none" stroke="#1d4ed8" stroke-width="2.5"/><circle cx="80" cy="290" r="4" fill="#1d4ed8"/><text x="80" y="310" font-size="11" fill="#616e7c" font-weight="400" text-anchor="middle">L1</text><text x="80" y="280" font-size="11" fill="#1f2933" font-weight="400" text-anchor="middle">0</text><circle cx="206.66666666666666" cy="273.3333333333333" r="4" fill="#1d4ed8"/><text x="206.66666666666666" y="310" font-size="11" fill="#616e7c" font-weight="400" text-anchor="middle">L2</text><text x="206.66666666666666" y="263.3333333333333" font-size="11" fill="#1f2933" font-weight="400" text-anchor="middle">1,000</text><circle cx="333.3333333333333" cy="247.51666666666665" r="4" fill="#1d4ed8"/><text x="333.3333333333333" y="310" font-size="11" fill="#616e7c" font-weight="400" text-anchor="middle">L3</text><text x="333.3333333333333" y="237.51666666666665" font-size="11" fill="#1f2933" font-weight="400" text-anchor="middle">2,549</text><circle cx="460" cy="216.55" r="4" fill="#1d4ed8"/><text x="460" y="310" font-size="11" fill="#616e7c" font-weight="400" text-anchor="middle">L4</text><text x="460" y="206.55" font-size="11" fill="#1f2933" font-weight="400" text-anchor="middle">4,407</text><circle cx="586.6666666666666" cy="181.7" r="4" fill="#1d4ed8"/><text x="586.6666666666666" y="310" font-size="11" fill="#616e7c" font-weight="400" text-anchor="middle">L5</text><text x="586.6666666666666" y="171.7" font-size="11" fill="#1f2933" font-weight="400" text-anchor="middle">6,498</text><circle cx="713.3333333333334" cy="143.63333333333333" r="4" fill="#1d4ed8"/><text x="713.3333333333334" y="310" font-size="11" fill="#616e7c" font-weight="400" text-anchor="middle">L6</text><text x="713.3333333333334" y="133.63333333333333" font-size="11" fill="#1f2933" font-weight="400" text-anchor="middle">8,782</text><circle cx="840" cy="102.78333333333333" r="4" fill="#1d4ed8"/><text x="840" y="310" font-size="11" fill="#616e7c" font-weight="400" text-anchor="middle">L7</text><text x="840" y="92.78333333333333" font-size="11" fill="#1f2933" font-weight="400" text-anchor="middle">11,233</text><text x="80" y="340" font-size="12" fill="#616e7c" font-weight="400" text-anchor="start">Cumulative XP required</text></svg>