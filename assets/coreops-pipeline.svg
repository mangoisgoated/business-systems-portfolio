<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-label="CoreOps pipeline" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<rect width="900" height="400" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#616e7c"/></marker></defs>
<text x="24" y="32" font-size="18" fill="#1f2933" font-weight="700" text-anchor="start">CoreOps CRM: lead-to-customer pipeline</text><text x="24" y="52" font-size="12" fill="#616e7c" font-weight="400" text-anchor="start">Each step is a separate, guarded module. Paid providers sit behind a cost guard; every send passes one eligibility gate.</text><rect x="24" y="90" width="190" height="62" rx="8" fill="#dbeafe" stroke="#1d4ed8"/><text x="119" y="118" font-size="13" fill="#1f2933" font-weight="600" text-anchor="middle">Discover</text><text x="119" y="136" font-size="11" fill="#616e7c" font-weight="400" text-anchor="middle">scheduled map search</text><line x1="214" y1="121" x2="244" y2="121" stroke="#616e7c" stroke-width="1.5" marker-end="url(#a)"/><rect x="244" y="90" width="190" height="62" rx="8" fill="#dbeafe" stroke="#1d4ed8"/><text x="339" y="118" font-size="13" fill="#1f2933" font-weight="600" text-anchor="middle">Dedupe</text><text x="339" y="136" font-size="11" fill="#616e7c" font-weight="400" text-anchor="middle">against existing prospects</text><line x1="434" y1="121" x2="464" y2="121" stroke="#616e7c" stroke-width="1.5" marker-end="url(#a)"/><rect x="464" y="90" width="190" height="62" rx="8" fill="#dbeafe" stroke="#1d4ed8"/><text x="559" y="118" font-size="13" fill="#1f2933" font-weight="600" text-anchor="middle">Enrich</text><text x="559" y="136" font-size="11" fill="#616e7c" font-weight="400" text-anchor="middle">site crawl, email lookup</text><line x1="654" y1="121" x2="684" y2="121" stroke="#616e7c" stroke-width="1.5" marker-end="url(#a)"/><rect x="684" y="90" width="190" height="62" rx="8" fill="#dbeafe" stroke="#1d4ed8"/><text x="779" y="118" font-size="13" fill="#1f2933" font-weight="600" text-anchor="middle">Score</text><text x="779" y="136" font-size="11" fill="#616e7c" font-weight="400" text-anchor="middle">opportunity grade</text><rect x="24" y="200" width="190" height="62" rx="8" fill="#fef3c7" stroke="#b45309"/><text x="119" y="228" font-size="13" fill="#1f2933" font-weight="600" text-anchor="middle">Eligibility gate</text><text x="119" y="246" font-size="11" fill="#616e7c" font-weight="400" text-anchor="middle">verify, suppress, cooldown</text><line x1="214" y1="231" x2="244" y2="231" stroke="#616e7c" stroke-width="1.5" marker-end="url(#a)"/><rect x="244" y="200" width="190" height="62" rx="8" fill="#ccfbf1" stroke="#0f766e"/><text x="339" y="228" font-size="13" fill="#1f2933" font-weight="600" text-anchor="middle">Campaign</text><text x="339" y="246" font-size="11" fill="#616e7c" font-weight="400" text-anchor="middle">paced multi-step email</text><line x1="434" y1="231" x2="464" y2="231" stroke="#616e7c" stroke-width="1.5" marker-end="url(#a)"/><rect x="464" y="200" width="190" height="62" rx="8" fill="#ccfbf1" stroke="#0f766e"/><text x="559" y="228" font-size="13" fill="#1f2933" font-weight="600" text-anchor="middle">Replies</text><text x="559" y="246" font-size="11" fill="#616e7c" font-weight="400" text-anchor="middle">classify, STOP / HOLD</text><line x1="654" y1="231" x2="684" y2="231" stroke="#616e7c" stroke-width="1.5" marker-end="url(#a)"/><rect x="684" y="200" width="190" height="62" rx="8" fill="#ccfbf1" stroke="#0f766e"/><text x="779" y="228" font-size="13" fill="#1f2933" font-weight="600" text-anchor="middle">Pipeline</text><text x="779" y="246" font-size="11" fill="#616e7c" font-weight="400" text-anchor="middle">stages, tasks, My Day</text><line x1="110" y1="152" x2="110" y2="200" stroke="#616e7c" stroke-width="1.5" marker-end="url(#a)"/><rect x="24" y="320" width="852" height="52" rx="8" fill="#f5f7fa" stroke="#cbd2d9"/><text x="450" y="343" font-size="13" fill="#1f2933" font-weight="600" text-anchor="middle">Google Sheet (system of record) + Apps Script web app with role-based access</text><text x="450" y="361" font-size="11" fill="#616e7c" font-weight="400" text-anchor="middle">time-driven triggers, provider cost guard, audit ledgers</text></svg>