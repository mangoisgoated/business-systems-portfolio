<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#616e7c"/></marker></defs>
<text x="24" y="32" font-size="18" fill="#1f2933" font-weight="700" text-anchor="start">Follow-up engine: from customer status to a reviewed message</text><text x="24" y="52" font-size="12" fill="#616e7c" font-weight="400" text-anchor="start">Workflow diagram. Table-driven rules decide what is due; AI drafts; eligibility and review gate every send.</text><rect x="24" y="90" width="180" height="56" rx="8" fill="#dbeafe" stroke="#1d4ed8"/><text x="114" y="115" font-size="13" fill="#1f2933" font-weight="600" text-anchor="middle">CRM + Quote Lines</text><text x="114" y="133" font-size="11" fill="#616e7c" font-weight="400" text-anchor="middle">customers, quoted lines, renewals</text><rect x="24" y="160" width="180" height="56" rx="8" fill="#dbeafe" stroke="#1d4ed8"/><text x="114" y="185" font-size="13" fill="#1f2933" font-weight="600" text-anchor="middle">Opportunities</text><text x="114" y="203" font-size="11" fill="#616e7c" font-weight="400" text-anchor="middle">future / waiting-on-budget</text><rect x="24" y="230" width="180" height="56" rx="8" fill="#dbeafe" stroke="#1d4ed8"/><text x="114" y="255" font-size="13" fill="#1f2933" font-weight="600" text-anchor="middle">Post-Sale Tasks</text><text x="114" y="273" font-size="11" fill="#616e7c" font-weight="400" text-anchor="middle">documents, programs</text><rect x="260" y="140" width="170" height="90" rx="8" fill="#fef3c7" stroke="#b45309"/><text x="345" y="182" font-size="13" fill="#1f2933" font-weight="600" text-anchor="middle">Workflow rules</text><text x="345" y="200" font-size="11" fill="#616e7c" font-weight="400" text-anchor="middle">status + step + offset days + template</text><rect x="480" y="140" width="170" height="90" rx="8" fill="#ccfbf1" stroke="#0f766e"/><text x="565" y="182" font-size="13" fill="#1f2933" font-weight="600" text-anchor="middle">Follow-Up Engine</text><text x="565" y="200" font-size="11" fill="#616e7c" font-weight="400" text-anchor="middle">one queue row per action, deterministic ID</text><rect x="700" y="90" width="176" height="56" rx="8" fill="#f5f7fa" stroke="#cbd2d9"/><text x="788" y="115" font-size="13" fill="#1f2933" font-weight="600" text-anchor="middle">AI draft</text><text x="788" y="133" font-size="11" fill="#616e7c" font-weight="400" text-anchor="middle">email + text, per-customer context</text><rect x="700" y="160" width="176" height="56" rx="8" fill="#f5f7fa" stroke="#cbd2d9"/><text x="788" y="185" font-size="13" fill="#1f2933" font-weight="600" text-anchor="middle">Eligibility + hold checks</text><text x="788" y="203" font-size="11" fill="#616e7c" font-weight="400" text-anchor="middle">contact preference, hold-until, language</text><rect x="700" y="230" width="176" height="56" rx="8" fill="#f5f7fa" stroke="#cbd2d9"/><text x="788" y="255" font-size="13" fill="#1f2933" font-weight="600" text-anchor="middle">Owner reviews and sends</text><text x="788" y="273" font-size="11" fill="#616e7c" font-weight="400" text-anchor="middle">email draft, text queue</text><rect x="480" y="330" width="170" height="56" rx="8" fill="#f5f7fa" stroke="#cbd2d9"/><text x="565" y="355" font-size="13" fill="#1f2933" font-weight="600" text-anchor="middle">Activity Log</text><text x="565" y="373" font-size="11" fill="#616e7c" font-weight="400" text-anchor="middle">every send, skip, result</text><rect x="260" y="330" width="170" height="56" rx="8" fill="#fee2e2" stroke="#b91c1c"/><text x="345" y="355" font-size="13" fill="#1f2933" font-weight="600" text-anchor="middle">Needs Attention</text><text x="345" y="373" font-size="11" fill="#616e7c" font-weight="400" text-anchor="middle">superseded or stale drafts</text><rect x="24" y="330" width="180" height="56" rx="8" fill="#ccfbf1" stroke="#0f766e"/><text x="114" y="355" font-size="13" fill="#1f2933" font-weight="600" text-anchor="middle">Today</text><text x="114" y="373" font-size="11" fill="#616e7c" font-weight="400" text-anchor="middle">unified action list</text><line x1="204" y1="118" x2="260" y2="185" stroke="#616e7c" s