<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" width="900" height="350" role="img" aria-label="Synthetic agent distribution by tier" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<rect width="900" height="350" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#616e7c"/></marker></defs>
<text x="24" y="32" font-size="18" fill="#1f2933" font-weight="700" text-anchor="start">Where agents land (120 synthetic agent-months, fictional agency)</text><text x="24" y="52" font-size="12" fill="#616e7c" font-weight="400" text-anchor="start">Average payout per agent-month: $1,970 current vs $2,146 adjusted. Illustrative, not real agency data.</text><text x="40" y="92" font-size="13" fill="#1f2933" font-weight="600" text-anchor="start">Current structure</text><rect x="40" y="110" width="89.10000000000001" height="30" fill="#b91c1c" opacity="0.85"/><text x="137.10000000000002" y="130" font-size="13" fill="#1f2933" font-weight="600" text-anchor="start">23%</text><text x="40" y="156" font-size="11" fill="#616e7c" font-weight="400" text-anchor="start">4.0% tier</text><rect x="40" y="168" width="257.40000000000003" height="30" fill="#b91c1c" opacity="0.85"/><text x="305.40000000000003" y="188" font-size="13" fill="#1f2933" font-weight="600" text-anchor="start">65%</text><text x="40" y="214" font-size="11" fill="#616e7c" font-weight="400" text-anchor="start">5.0% tier</text><rect x="40" y="226" width="49.5" height="30" fill="#b91c1c" opacity="0.85"/><text x="97.5" y="246" font-size="13" fill="#1f2933" font-weight="600" text-anchor="start">13%</text><text x="40" y="272" font-size="11" fill="#616e7c" font-weight="400" text-anchor="start">6.5% tier</text><text x="470" y="92" font-size="13" fill="#1f2933" font-weight="600" text-anchor="start">Adjusted threshold</text><rect x="470" y="110" width="89.10000000000001" height="30" fill="#0f766e" opacity="0.85"/><text x="567.1" y="130" font-size="13" fill="#1f2933" font-weight="600" text-anchor="start">23%</text><text x="470" y="156" font-size="11" fill="#616e7c" font-weight="400" text-anchor="start">4.0% tier</text><rect x="470" y="168" width="151.8" height="30" fill="#0f766e" opacity="0.85"/><text x="629.8" y="188" font-size="13" fill="#1f2933" font-weight="600" text-anchor="start">38%</text><text x="470" y="214" font-size="11" fill="#616e7c" font-weight="400" text-anchor="start">5.0% tier</text><rect x="470" y="226" width="155.10000000000002" height="30" fill="#0f766e" opacity="0.85"/><text x="633.1" y="246" font-size="13" fill="#1f2933" font-weight="600" text-anchor="start">39%</text><text x="470" y="272" font-size="11" fill="#616e7c" font-weight="400" text-anchor="start">6.5% tier</text><text x="24" y="330" font-size="11" fill="#616e7c" font-weight="400" text-anchor="start">Method: seeded random draw (mean $38k, sd $11k), tiers applied to every agent-month. Rates and thresholds are invented for demonstration.</text></svg>