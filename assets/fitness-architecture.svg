<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-label="Fitness RPG architecture" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<rect width="900" height="400" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#616e7c"/></marker></defs>
<text x="24" y="32" font-size="18" fill="#1f2933" font-weight="700" text-anchor="start">Fitness RPG: V1 data model and planned integrations</text><text x="24" y="52" font-size="12" fill="#616e7c" font-weight="400" text-anchor="start">Solid = built in the Google Sheets backend. Dashed = designed, not yet built or connected.</text><rect x="330" y="90" width="240" height="70" rx="8" fill="#ccfbf1" stroke="#0f766e"/><text x="450" y="122" font-size="13" fill="#1f2933" font-weight="600" text-anchor="middle">Rules + state (Sheets)</text><text x="450" y="140" font-size="11" fill="#616e7c" font-weight="400" text-anchor="middle">19 tabs: logs, ledger, scheduler, levels</text><rect x="24" y="200" width="190" height="56" rx="8" fill="#dbeafe" stroke="#1d4ed8"/><text x="119" y="225" font-size="13" fill="#1f2933" font-weight="600" text-anchor="middle">Workout + set logs</text><text x="119" y="243" font-size="11" fill="#616e7c" font-weight="400" text-anchor="middle">progression targets</text><rect x="234" y="200" width="190" height="56" rx="8" fill="#dbeafe" stroke="#1d4ed8"/><text x="329" y="225" font-size="13" fill="#1f2933" font-weight="600" text-anchor="middle">Quest / penalty engine</text><text x="329" y="243" font-size="11" fill="#616e7c" font-weight="400" text-anchor="middle">XP, discipline</text><rect x="444" y="200" width="190" height="56" rx="8" fill="#dbeafe" stroke="#1d4ed8"/><text x="539" y="225" font-size="13" fill="#1f2933" font-weight="600" text-anchor="middle">Scheduler</text><text x="539" y="243" font-size="11" fill="#616e7c" font-weight="400" text-anchor="middle">recovery-aware day type</text><rect x="654" y="200" width="222" height="56" rx="8" fill="#dbeafe" stroke="#1d4ed8"/><text x="765" y="225" font-size="13" fill="#1f2933" font-weight="600" text-anchor="middle">Level curve + stats</text><text x="765" y="243" font-size="11" fill="#616e7c" font-weight="400" text-anchor="middle">200 levels, 6 character stats</text><rect stroke-dasharray="5 4" x="24" y="320" width="190" height="56" rx="8" fill="#fff" stroke="#616e7c"/><text x="119" y="345" font-size="13" fill="#1f2933" font-weight="600" text-anchor="middle">Web app UI</text><text x="119" y="363" font-size="11" fill="#616e7c" font-weight="400" text-anchor="middle">next build</text><rect stroke-dasharray="5 4" x="234" y="320" width="190" height="56" rx="8" fill="#fff" stroke="#616e7c"/><text x="329" y="345" font-size="13" fill="#1f2933" font-weight="600" text-anchor="middle">Apple Health bridge</text><text x="329" y="363" font-size="11" fill="#616e7c" font-weight="400" text-anchor="middle">awaiting endpoint</text><rect stroke-dasharray="5 4" x="444" y="320" width="190" height="56" rx="8" fill="#fff" stroke="#616e7c"/><text x="539" y="345" font-size="13" fill="#1f2933" font-weight="600" text-anchor="middle">Food photo estimate</text><text x="539" y="363" font-size="11" fill="#616e7c" font-weight="400" text-anchor="middle">user confirms</text><rect stroke-dasharray="5 4" x="654" y="320" width="222" height="56" rx="8" fill="#fff" stroke="#616e7c"/><text x="765" y="345" font-size="13" fill="#1f2933" font-weight="600" text-anchor="middle">Notifications</text><text x="765" y="363" font-size="11" fill="#616e7c" font-weight="400" text-anchor="middle">quest + calorie warnings</text><line x1="450" y1="160" x2="119" y2="200" stroke="#616e7c" stroke-width="1.5" marker-end="url(#a)"/><line x1="450" y1="160" x2="329" y2="200" stroke="#616e7c" stroke-width="1.5" marker-end="url(#a)"/><line x1="450" y1="160" x2="539" y2="200" stroke="#616e7c" stroke-width="1.5" marker-end="url(#a)"/><line x1="450" y1="160" x2="765" y2="200" stroke="#616e7c" stroke-width="1.5" marker-end="url(#a)"/><line x1="119" y1="256" x2="119" y2="320" stroke="#616e7c" stroke-width="1.5" marker-end="url(#a)"/><line x1="329" y1="256" x2="329" y2="320" stroke="#616e7c" stroke-width="1.5" marker-end="url(#a)"/><line x1="539" y1="256" x2="539" y2="320" stroke="#616e7c" stroke-width="1.5" marker-end="url(#a)"/><line x1="765" y1="256" x2="765" y2="320" stroke="#616e7c" stroke-width="1.5" marker-end="url(#a)"/></svg>