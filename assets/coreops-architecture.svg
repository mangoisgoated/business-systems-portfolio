<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 370" width="900" height="370" role="img" aria-label="CoreOps architecture" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<rect width="900" height="370" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#616e7c"/></marker></defs>
<text x="24" y="32" font-size="18" fill="#1f2933" font-weight="700" text-anchor="start">CoreOps CRM: system architecture (simplified)</text><text x="24" y="52" font-size="12" fill="#616e7c" font-weight="400" text-anchor="start">Infrastructure details intentionally omitted. Public view shows components and responsibilities only.</text><rect x="24" y="96" width="200" height="60" rx="8" fill="#dbeafe" stroke="#1d4ed8"/><text x="124" y="123" font-size="13" fill="#1f2933" font-weight="600" text-anchor="middle">Staff (browser)</text><text x="124" y="141" font-size="11" fill="#616e7c" font-weight="400" text-anchor="middle">domain sign-in, Admin / Caller</text><rect x="300" y="96" width="300" height="60" rx="8" fill="#ccfbf1" stroke="#0f766e"/><text x="450" y="123" font-size="13" fill="#1f2933" font-weight="600" text-anchor="middle">Apps Script web app</text><text x="450" y="141" font-size="11" fill="#616e7c" font-weight="400" text-anchor="middle">25 source files, 4 scheduled triggers</text><rect x="676" y="96" width="200" height="60" rx="8" fill="#f5f7fa" stroke="#cbd2d9"/><text x="776" y="123" font-size="13" fill="#1f2933" font-weight="600" text-anchor="middle">Google Sheet</text><text x="776" y="141" font-size="11" fill="#616e7c" font-weight="400" text-anchor="middle">prospects, campaigns, logs</text><rect x="24" y="230" width="190" height="56" rx="8" fill="#fef3c7" stroke="#b45309"/><text x="119" y="255" font-size="13" fill="#1f2933" font-weight="600" text-anchor="middle">Maps discovery API</text><text x="119" y="273" font-size="11" fill="#616e7c" font-weight="400" text-anchor="middle">budget-capped</text><rect x="234" y="230" width="190" height="56" rx="8" fill="#fef3c7" stroke="#b45309"/><text x="329" y="255" font-size="13" fill="#1f2933" font-weight="600" text-anchor="middle">Email lookup + verify</text><text x="329" y="273" font-size="11" fill="#616e7c" font-weight="400" text-anchor="middle">allowance-capped</text><rect x="444" y="230" width="210" height="56" rx="8" fill="#fef3c7" stroke="#b45309"/><text x="549" y="255" font-size="13" fill="#1f2933" font-weight="600" text-anchor="middle">Research service</text><text x="549" y="273" font-size="11" fill="#616e7c" font-weight="400" text-anchor="middle">self-hosted, authenticated</text><rect x="674" y="230" width="202" height="56" rx="8" fill="#f5f7fa" stroke="#cbd2d9"/><text x="775" y="255" font-size="13" fill="#1f2933" font-weight="600" text-anchor="middle">Gmail send + reply sync</text><text x="775" y="273" font-size="11" fill="#616e7c" font-weight="400" text-anchor="middle">per-mailbox daily limits</text><line x1="224" y1="126" x2="300" y2="126" stroke="#616e7c" stroke-width="1.5" marker-end="url(#a)"/><line x1="600" y1="126" x2="676" y2="126" stroke="#616e7c" stroke-width="1.5" marker-end="url(#a)"/><line x1="390" y1="156" x2="119" y2="230" stroke="#616e7c" stroke-width="1.5" marker-end="url(#a)"/><line x1="430" y1="156" x2="329" y2="230" stroke="#616e7c" stroke-width="1.5" marker-end="url(#a)"/><line x1="470" y1="156" x2="549" y2="230" stroke="#616e7c" stroke-width="1.5" marker-end="url(#a)"/><line x1="510" y1="156" x2="775" y2="230" stroke="#616e7c" stroke-width="1.5" marker-end="url(#a)"/><text x="24" y="340" font-size="12" fill="#616e7c" font-weight="400" text-anchor="start">Safeguards: one outreach eligibility gate, suppression and Do-Not-Contact lists, business-hours pacing, provider cost guard, reply-driven STOP / HOLD.</text></svg>